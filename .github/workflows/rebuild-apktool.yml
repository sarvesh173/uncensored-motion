name: Build Uncensored APK from Reconstructed Sources

on:
  push:
    branches: [ "main", "feat/*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apktool:
    name: Build & Sign Uncensored APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Locate Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Install Apktool 3.0.3
        run: |
          mkdir -p ~/.local/bin
          curl -L -s https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o ~/.local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar ~/.local/bin/apktool.jar "$@"\n' > ~/.local/bin/apktool
          chmod +x ~/.local/bin/apktool
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile APK via Apktool
        run: |
          mkdir -p build
          apktool b decompiled/apktool -o build/Uncensored-APK-unsigned.apk

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 build/Uncensored-APK-unsigned.apk build/Uncensored-APK-aligned.apk
          keytool -genkeypair -v -keystore build/uncensored.keystore -alias uncensored_motion_key \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass uncensored2026 -keypass uncensored2026 \
                  -dname "CN=Uncensored Motion Open Source, OU=Open Source Community, O=Uncensored Motion, L=Worldwide, ST=OpenSource, C=US"
          apksigner sign --ks build/uncensored.keystore --ks-key-alias uncensored_motion_key \
                         --ks-pass pass:uncensored2026 \
                         --out build/Uncensored-APK.apk build/Uncensored-APK-aligned.apk
          apksigner verify --print-certs build/Uncensored-APK.apk

      - name: Package Complete Source Code ZIP
        run: |
          zip -r build/uncensored-motion-source-v2.1.0.zip android docs analysis extracted-format skills .github README.md LICENSE agent.md .gitignore

      - name: Upload Uncensored APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uncensored-APK
          path: build/Uncensored-APK.apk
          retention-days: 14

      - name: Upload Source Code ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uncensored-motion-source
          path: build/uncensored-motion-source-v2.1.0.zip
          retention-days: 14

      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-uncensored-opensource
          name: "Uncensored APK v2.1.0 (Open Source Edition)"
          body: |
            ## Uncensored Motion v2.1.0 — Open Source Edition
            The definitive open-source, uncensored mobile motion graphics suite uniting **After Motion Z**, **Golden Motion**, **G Motion**, and **After Motion X / CC+** into a single clean architecture.

            ### Downloads
            - **[📥 Download Uncensored-APK.apk](https://github.com/sarvesh173/uncensored-motion/releases/download/v2.1.0-uncensored-opensource/Uncensored-APK.apk)** — Pre-built, signed APK ready to install.
            - **[📦 Download Source Code ZIP](https://github.com/sarvesh173/uncensored-motion/releases/download/v2.1.0-uncensored-opensource/uncensored-motion-source-v2.1.0.zip)** — Complete source code package.

            ### Highlights
            - **Custom Package Identity:** `com.uncensored.motion` (100% clean decoupling).
            - **Cryptographic Signature:** Verified custom Open Source keystore.
            - **Uncensored Engine:** No subscription locks, no watermarks, full 4K 60fps export, custom shaders, and XML project portability.
          files: |
            build/Uncensored-APK.apk
            build/uncensored-motion-source-v2.1.0.zip
          draft: false
          prerelease: false
