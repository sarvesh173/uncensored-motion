<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#181424"/>
    </linearGradient>

    <!-- Neon Ribbon Gradients -->
    <linearGradient id="neonU" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="neonM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ff4e50"/>
      <stop offset="100%" stop-color="#f857a6"/>
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Squircle Clip -->
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- Background Base with Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#26283b" stroke-width="4"/>

  <!-- Subtle Accent Grid / Aura -->
  <g clip-path="url(#squircle)">
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#glowG)" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.12"/>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <rect x="16" y="16" width="480" height="480" fill="url(#centerGlow)"/>
  </g>

  <!-- Uncensored Motion Symbol: Fluid Interlocking Kinetic Waves -->
  <!-- Left Wing: Sleek 'U' Ribbon surging upwards -->
  <path d="M 140 160
           C 140 290, 160 360, 240 360
           C 270 360, 290 345, 305 320
           C 285 315, 270 305, 255 290
           C 215 285, 200 240, 200 160
           Z"
        fill="url(#neonU)" filter="url(#neonGlow)"/>

  <!-- Right Wing: Kinetic 'M' Surge looping through -->
  <path d="M 372 160
           C 372 290, 352 360, 272 360
           C 242 360, 222 345, 207 320
           C 227 315, 242 305, 257 290
           C 297 285, 312 240, 312 160
           Z"
        fill="url(#neonM)" filter="url(#neonGlow)"/>

  <!-- Center Floating Motion Kinetic Diamond (The Keyframe Anchor) -->
  <polygon points="256,190 286,240 256,290 226,240" fill="url(#glowG)" filter="url(#neonGlow)" />
  <circle cx="256" cy="240" r="8" fill="#ffffff" />

  <!-- Speed Trail Flares (Uncensored Velocity) -->
  <path d="M 120 180 Q 256 120 392 180" fill="none" stroke="url(#neonU)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 16" opacity="0.6"/>
  <path d="M 130 330 Q 256 390 382 330" fill="none" stroke="url(#neonM)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 16" opacity="0.6"/>
</svg>
